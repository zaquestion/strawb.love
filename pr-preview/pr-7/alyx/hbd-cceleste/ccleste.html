<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>hbd, alyx · strawb.love</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../berry-180.png">
  <link rel="icon" type="image/png" href="../../berry-192.png">
  <meta name="theme-color" content="#f2ecfa">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #f2ecfa;
      color: #4a3457;
      font-family: 'Nunito', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100dvh;
      padding: 20px 16px calc(16px + env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }
    a { color: #7b4ba3; text-decoration: none; }
    a:hover { color: #5f3585; }

    .wrap {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .back {
      align-self: flex-start;
      font-size: 13px;
      font-weight: 800;
      color: #9a7fb8;
      margin-bottom: 10px;
    }
    header { text-align: center; margin-bottom: 16px; }
    h1 {
      font-family: 'Baloo 2', cursive;
      font-size: clamp(24px, 6vw, 30px);
      font-weight: 800;
      color: #7b4ba3;
      line-height: 1.1;
    }
    header p {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 600;
      color: #9a7fb8;
    }

    .game-card {
      position: relative;
      background: #fff;
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 3px 10px rgba(90, 60, 120, .14);
      /* fallback only — the sizing script below pins an exact px size */
      width: min(100%, 512px);
    }
    /* the canvas must not have any border or padding, or mouse coords will be wrong */
    canvas#canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      height: auto;
      border: 0 none;
      border-radius: 8px;
      background: #1a1424;
      image-rendering: pixelated;
      touch-action: none;
    }
    #loading {
      position: absolute;
      inset: 10px;
      border-radius: 8px;
      background: #1a1424;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: 16px;
    }
    #loading .berry {
      font-size: 34px;
      animation: bounce 1s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.08); }
    }
    #status { font-size: 13px; font-weight: 700; color: #d8cbf0; }
    #progress {
      width: min(60%, 220px);
      accent-color: #c9366d;
    }

    .kbd-hint {
      margin-top: 14px;
      font-size: 12px;
      font-weight: 700;
      color: #9a7fb8;
      text-align: center;
      line-height: 1.7;
    }
    .kbd-hint b {
      display: inline-block;
      background: #fff;
      border-radius: 5px;
      padding: 0 6px;
      box-shadow: 0 1px 3px rgba(90, 60, 120, .18);
      color: #7b4ba3;
      font-weight: 800;
    }

    footer {
      margin-top: auto;
      padding-top: 16px;
      font-size: 11.5px;
      font-weight: 700;
      color: #bda4d6;
    }

    /* ── touch gamepad ── */
    .touch-controls {
      display: none;
      width: 100%;
      max-width: 560px;
      margin-top: 14px;
      align-items: stretch;
      justify-content: space-between;
      gap: 12px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    @media (pointer: coarse) {
      .touch-controls { display: flex; }
      .kbd-hint { display: none; }
    }
    #stick-zone {
      position: relative;
      flex: 1 1 50%;
      min-height: 170px;
      border-radius: 16px;
      background: rgba(255, 255, 255, .45);
      box-shadow: inset 0 0 0 2px rgba(155, 127, 184, .25);
    }
    #stick-base {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 104px;
      height: 104px;
      margin: -52px 0 0 -52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .8);
      box-shadow: inset 0 0 0 3px #d8cbf0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stick-nub {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #7b4ba3;
      border: 3px solid #fff;
      box-shadow: 0 4px 10px rgba(90, 60, 120, .35);
    }
    .btn-zone {
      flex: 1 1 50%;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 8px;
      position: relative;
    }
    .pad-btn {
      border: 3px solid #fff;
      border-radius: 50%;
      color: #fff;
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: transform .06s ease;
    }
    .pad-btn.held { transform: scale(.92); filter: brightness(1.1); }
    #btn-jump {
      width: 84px;
      height: 84px;
      background: #c9366d;
      font-size: 17px;
      box-shadow: 0 5px 14px rgba(201, 54, 109, .4);
      margin-right: 6px;
    }
    #btn-dash {
      width: 72px;
      height: 72px;
      background: #7b4ba3;
      font-size: 15px;
      box-shadow: 0 5px 14px rgba(123, 75, 163, .4);
      margin-right: 64px;
    }
    #btn-pause {
      position: absolute;
      top: 0;
      right: 0;
      border: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, .7);
      color: #9a7fb8;
      font-family: 'Nunito', sans-serif;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 14px;
      box-shadow: 0 1px 4px rgba(90, 60, 120, .18);
      touch-action: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../../index.html">← back to the patch</a>
    <header>
      <h1>hbd, alyx! 🎂</h1>
      <p>a tiny mountain to climb 🍓</p>
    </header>

    <div class="game-card">
      <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
      <div id="loading">
        <div class="berry">🍓</div>
        <div id="status">warming up…</div>
        <progress value="0" max="100" id="progress" hidden></progress>
      </div>
    </div>

    <p class="kbd-hint">
      <b>←</b> <b>→</b> <b>↑</b> <b>↓</b> move &nbsp;·&nbsp; <b>Z</b>/<b>C</b> jump &nbsp;·&nbsp; <b>X</b>/<b>V</b> dash<br>
      <b>esc</b> pause &nbsp;·&nbsp; <b>shift+S</b> save state &nbsp;·&nbsp; <b>shift+D</b> load state
    </p>

    <div class="touch-controls" id="touch-controls">
      <div id="stick-zone">
        <div id="stick-base"><div id="stick-nub"></div></div>
      </div>
      <div class="btn-zone">
        <button id="btn-pause" type="button">pause</button>
        <div class="pad-btn" id="btn-dash">dash</div>
        <div class="pad-btn" id="btn-jump">jump</div>
      </div>
    </div>

    <footer>love, zaq</footer>
  </div>

  <script>
    // The game sizes its framebuffer from the canvas element's CSS size at
    // boot and follows later element resizes — a path that garbles rendering
    // on some phone GPUs. Pin the canvas to a fixed integer size (multiple of
    // 8, so edges land on device pixels at common DPRs) computed once, so the
    // element can never change size after the game boots, no matter what the
    // URL bar, fonts, or rotation do to the layout.
    (function () {
      var coarse = matchMedia('(pointer: coarse)').matches;
      var availW = document.documentElement.clientWidth - 32 - 20; // page + card padding
      var availH = window.innerHeight - (coarse ? 400 : 200);      // header/controls/footer
      var size = Math.min(512, availW, Math.max(availH, 240));
      size = Math.max(160, 8 * Math.floor(size / 8));
      var canvas = document.getElementById('canvas');
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
      document.querySelector('.game-card').style.width = (size + 20) + 'px';
    })();

    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var loadingElement = document.getElementById('loading');

    var Module = {
      preRun: [],
      postRun: [],
      print: function () { console.log.apply(console, arguments); },
      printErr: function () { console.error.apply(console, arguments); },
      canvas: (function () {
        var canvas = document.getElementById('canvas');
        canvas.addEventListener('webglcontextlost', function (e) {
          alert('the game lost its graphics context — reload the page to keep climbing');
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      setStatus: function (text) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
        if (text === Module.setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if (m && now - Module.setStatus.last.time < 30) return; // skip too-frequent progress updates
        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;
        if (m) {
          text = m[1];
          progressElement.value = parseInt(m[2]) * 100;
          progressElement.max = parseInt(m[4]) * 100;
          progressElement.hidden = false;
        } else {
          progressElement.hidden = true;
        }
        statusElement.textContent = text;
        loadingElement.style.display = text ? 'flex' : 'none';
      },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left
          ? 'unpacking… (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
          : 'here we go!');
      }
    };
    Module.setStatus('picking strawberries…');
    window.onerror = function () {
      Module.setStatus('oh no — something broke, check the console');
      Module.setStatus = function (text) {
        if (text) Module.printErr('[post-exception status] ' + text);
      };
    };
  </script>

  <script>
    // ── touch gamepad ──
    // The emscripten build reads keyboard input via HTML5 key callbacks on
    // window/document, so synthetic KeyboardEvents dispatched on the canvas
    // (with bubbles: true) reach it like real key presses.
    (function () {
      var canvas = document.getElementById('canvas');
      var KEYS = {
        left:  { key: 'ArrowLeft',  code: 'ArrowLeft',  kc: 37 },
        up:    { key: 'ArrowUp',    code: 'ArrowUp',    kc: 38 },
        right: { key: 'ArrowRight', code: 'ArrowRight', kc: 39 },
        down:  { key: 'ArrowDown',  code: 'ArrowDown',  kc: 40 },
        jump:  { key: 'c',          code: 'KeyC',       kc: 67 },
        dash:  { key: 'x',          code: 'KeyX',       kc: 88 },
        pause: { key: 'Escape',     code: 'Escape',     kc: 27 }
      };
      var held = {};

      function fire(type, name) {
        var k = KEYS[name];
        var ev = new KeyboardEvent(type, { key: k.key, code: k.code, bubbles: true, cancelable: true });
        // KeyboardEvent constructors ignore keyCode/which; the game reads both
        Object.defineProperty(ev, 'keyCode', { value: k.kc });
        Object.defineProperty(ev, 'which', { value: k.kc });
        canvas.dispatchEvent(ev);
      }
      function press(name) { if (!held[name]) { held[name] = true; fire('keydown', name); } }
      function release(name) { if (held[name]) { delete held[name]; fire('keyup', name); } }

      // mobile browsers keep audio suspended until a real (trusted) gesture
      function resumeAudio(e) {
        if (!e.isTrusted) return;
        var ctx = window.Module && Module.SDL2 && Module.SDL2.audioContext;
        if (ctx && ctx.state === 'suspended') ctx.resume();
      }
      document.addEventListener('pointerdown', resumeAudio, true);
      document.addEventListener('keydown', resumeAudio, true);

      // ── thumbstick: floating origin, 8-way with equal 45° sectors so
      // diagonal dashes are easy to hit ──
      var zone = document.getElementById('stick-zone');
      var base = document.getElementById('stick-base');
      var nub = document.getElementById('stick-nub');
      var TRAVEL = 34;    // max visual nub travel, px
      var DEADZONE = 10;  // px before any direction registers
      var stickId = null;
      var origin = null;
      var SECTORS = {
        '0': ['right'], '1': ['right', 'down'], '2': ['down'], '3': ['down', 'left'],
        '4': ['left'], '-4': ['left'], '-3': ['left', 'up'], '-2': ['up'], '-1': ['up', 'right']
      };

      function setDirs(dx, dy) {
        var active = {};
        if (Math.hypot(dx, dy) > DEADZONE) {
          var oct = Math.round(Math.atan2(dy, dx) / (Math.PI / 4));
          (SECTORS[oct] || []).forEach(function (d) { active[d] = true; });
        }
        ['left', 'right', 'up', 'down'].forEach(function (d) {
          active[d] ? press(d) : release(d);
        });
      }

      function resetStick() {
        stickId = null;
        origin = null;
        setDirs(0, 0);
        base.style.left = '';
        base.style.top = '';
        base.style.margin = '';
        nub.style.transform = '';
      }

      zone.addEventListener('pointerdown', function (e) {
        if (stickId !== null) return;
        e.preventDefault();
        stickId = e.pointerId;
        zone.setPointerCapture(stickId);
        origin = { x: e.clientX, y: e.clientY };
        var r = zone.getBoundingClientRect();
        base.style.left = (e.clientX - r.left) + 'px';
        base.style.top = (e.clientY - r.top) + 'px';
        base.style.margin = '-52px 0 0 -52px';
      });
      zone.addEventListener('pointermove', function (e) {
        if (e.pointerId !== stickId) return;
        var dx = e.clientX - origin.x;
        var dy = e.clientY - origin.y;
        var mag = Math.hypot(dx, dy);
        var len = Math.min(mag, TRAVEL);
        if (mag > 0) {
          nub.style.transform = 'translate(' + (dx / mag * len) + 'px,' + (dy / mag * len) + 'px)';
        }
        setDirs(dx, dy);
      });
      zone.addEventListener('pointerup', function (e) { if (e.pointerId === stickId) resetStick(); });
      zone.addEventListener('pointercancel', function (e) { if (e.pointerId === stickId) resetStick(); });

      // ── buttons ──
      function bindButton(el, name) {
        el.addEventListener('pointerdown', function (e) {
          e.preventDefault();
          el.setPointerCapture(e.pointerId);
          el.classList.add('held');
          press(name);
        });
        ['pointerup', 'pointercancel'].forEach(function (t) {
          el.addEventListener(t, function () {
            el.classList.remove('held');
            release(name);
          });
        });
      }
      bindButton(document.getElementById('btn-jump'), 'jump');
      bindButton(document.getElementById('btn-dash'), 'dash');
      bindButton(document.getElementById('btn-pause'), 'pause');

      document.getElementById('touch-controls').addEventListener('contextmenu', function (e) {
        e.preventDefault();
      });
    })();
  </script>

  <script async type="text/javascript" src="ccleste.js"></script>
</body>
</html>
