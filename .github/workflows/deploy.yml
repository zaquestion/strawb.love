name: Deploy

on:
  push:
    branches:
      - main

concurrency: deploy-gh-pages

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          # Don't wipe out the PR previews living alongside the main site
          clean-exclude: pr-preview
          force: false
